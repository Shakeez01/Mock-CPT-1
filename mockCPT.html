<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html>
  
<head>
   <!--The head section contains general information about the webpage.-->
   <title>     </title>
   <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"> </script>
   <style>
       /*The style section controls how pieces of your webpage look.*/
       /* This section was created by Gemini AI*/
        body { font-family: Arial, sans-serif; margin: 20px; }
       .section { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
       .section-title { font-weight: bold; font-size: 1.1em; }
       input { margin: 5px 0; padding: 6px; display: block; }
       button { padding: 6px 12px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
       button:hover { background-color: #45a049; }
   </style>
</head>


<body>
   <!--The body section contains the content of your webpage.-->
   <header>
       <h2>Personal Budget Planner</h2>
   </header>
   <div x-data="webApp">

    <!--Total budget section-->
         <div class="section">
        <span class="section-title">1. Total budget / Income</span>
        <label>How much money you have: </label>
        <input type="number" x-model="totalBudget" placeholder="Enter total amount...">
        <p>Your total budget: $<span x-text="totalBudget"></span></p>
      </div>

    <!--Expense input section-->
         <div class="section">
        <span class="section-title">2. Add expenses</span>
        <div id="TODO_textbox">
          <label for="textbox-demo">Type expense name:</label>
          <input type="text" x-model="textVal" placeholder="Type in your expenses...">
            </div>

            <label>Type expenses amount ($):</label>
            <input type="number" x-model.number="expenseAmount" placeholder="Type amount...">

        <!-- Expense List & Calculations Section -->
         <!--This section was generated by AI gemini-->
        <div class="section">
            <span class="section-title">3. Budget Summary & List</span>
            <p><strong>List of Expenses:</strong></p>
            <ul>
                <template x-for="item in expenses">
                    <li><span x-text="item.name"></span>: $<span x-text="item.amount"></span></li>
                </template>
            </ul>

            <p><strong>Total Expenses:</strong> $<span x-text="totalExpenses()"></span></p>
            <p><strong>Remaining Budget:</strong> $<span x-text="remainingBudget()"></span></p>
        </div>
  



   </div>
  
   <footer>
       <p>© 2026-2027<br>
       AP Computer Science Principles<br>
       George Washington High School</p>
   </footer>
  
   <script>
       //The script section contains the JavaScript logic
       document.addEventListener('alpine:init', () => {
           Alpine.data('webApp', () => ({
               textVal: "",
              expenseAmount: 0,
              totalBudget: 0,
              expenses: [],

              // Function to add item to the array
              // Generated by AI gemini
              addExpense() {
                  if (this.textVal.trim() !== "" && this.expenseAmount > 0) {
                      this.expenses.push({
                          name: this.textVal,
                          amount: this.expenseAmount
                      });
                      this.textVal = "";
                      this.expenseAmount = 0;
                  }
              },

              // Function to calculate total expenses
              totalExpenses() {
                  return this.expenses.reduce((sum, item) => sum + item.amount, 0);
              },

              // Function to calculate remaining budget
              // Generated by AI gemini
              remainingBudget() {
                  return this.totalBudget - this.totalExpenses();
              }
           }));
       });
   </script>
</body>
</html>
